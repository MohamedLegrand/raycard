basePath: /api/v1
definitions:
  dto.ConnexionRequestDTO:
    properties:
      email:
        example: awa.kone@example.com
        type: string
      mot_de_passe:
        example: motdepasse123
        type: string
    required:
    - email
    - mot_de_passe
    type: object
  dto.ConnexionResponseDTO:
    properties:
      expire_dans_sec:
        type: integer
      ticket:
        type: string
    type: object
  dto.DemanderReinitialisationRequestDTO:
    properties:
      email:
        example: awa.kone@example.com
        type: string
    required:
    - email
    type: object
  dto.DossierKycDTO:
    properties:
      admin_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      motif_rejet:
        type: string
      statut:
        type: string
      tier_demande:
        type: integer
      traite_at:
        type: string
      utilisateur_id:
        type: string
    type: object
  dto.ErreurDTO:
    properties:
      erreur:
        example: un compte existe déjà avec cet email
        type: string
    type: object
  dto.InscriptionRequestDTO:
    properties:
      email:
        example: awa.kone@example.com
        type: string
      mot_de_passe:
        example: motdepasse123
        minLength: 8
        type: string
      nom:
        example: Koné
        maxLength: 100
        minLength: 2
        type: string
      pays_code:
        example: CI
        type: string
      prenom:
        example: Awa
        maxLength: 100
        minLength: 2
        type: string
      telephone:
        example: "+2250700000000"
        type: string
    required:
    - email
    - mot_de_passe
    - nom
    - pays_code
    - prenom
    - telephone
    type: object
  dto.InscriptionResponseDTO:
    properties:
      utilisateur:
        $ref: '#/definitions/dto.UtilisateurDTO'
      wallet:
        $ref: '#/definitions/dto.WalletDTO'
    type: object
  dto.RafraichirRequestDTO:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  dto.ReinitialiserRequestDTO:
    properties:
      nouveau_mot_de_passe:
        example: nouveaumotdepasse123
        minLength: 8
        type: string
      token:
        example: "042951"
        type: string
    required:
    - nouveau_mot_de_passe
    - token
    type: object
  dto.RejeterDossierRequestDTO:
    properties:
      motif:
        example: pièce d'identité illisible
        minLength: 3
        type: string
    required:
    - motif
    type: object
  dto.SessionResponseDTO:
    properties:
      access_token:
        type: string
      access_token_expire_at:
        type: string
      refresh_token:
        type: string
      refresh_token_expire_at:
        type: string
    type: object
  dto.UtilisateurDTO:
    properties:
      email:
        example: awa.kone@example.com
        type: string
      id:
        example: 3fa2c1e4-9b5d-4a2e-8c1a-0e2f6a7b8c9d
        type: string
      kyc_statut:
        example: verifie
        type: string
      kyc_tier:
        example: 1
        type: integer
      nom:
        example: Koné
        type: string
      pays_code:
        example: CI
        type: string
      prenom:
        example: Awa
        type: string
      telephone:
        example: "+2250700000000"
        type: string
    type: object
  dto.VerifierCode2FARequestDTO:
    properties:
      code:
        example: "042951"
        type: string
      ticket:
        type: string
    required:
    - code
    - ticket
    type: object
  dto.WalletDTO:
    properties:
      devise:
        example: XOF
        type: string
      id:
        example: 7b8c9d0e-1f2a-4b3c-9d4e-5f6a7b8c9d0e
        type: string
      solde_centimes:
        example: 0
        type: integer
      statut:
        example: actif
        type: string
    type: object
host: localhost:3000
info:
  contact:
    name: RAYCARD — HR-Skills SARL
  description: API backend de la plateforme RAYCARD (wallet Mobile Money + cartes
    Visa virtuelles).
  title: RAYCARD API
  version: "1.0"
paths:
  /auth/connexion:
    post:
      consumes:
      - application/json
      description: 'Vérifie email + mot de passe et déclenche la 2FA obligatoire :
        envoie un code par email et renvoie un ticket à présenter avec ce code sur
        /auth/connexion/verifier-code. Aucun token de session n''est émis ici.'
      parameters:
      - description: Identifiants
        in: body
        name: connexion
        required: true
        schema:
          $ref: '#/definitions/dto.ConnexionRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ConnexionResponseDTO'
        "400":
          description: corps de requête invalide
          schema:
            $ref: '#/definitions/dto.ErreurDTO'
        "401":
          description: identifiants invalides
          schema:
            $ref: '#/definitions/dto.ErreurDTO'
        "500":
          description: erreur interne
          schema:
            $ref: '#/definitions/dto.ErreurDTO'
      summary: Connexion (étape 1/2)
      tags:
      - auth
  /auth/connexion/verifier-code:
    post:
      consumes:
      - application/json
      description: Échange le ticket obtenu à l'étape 1 et le code reçu par email
        contre une session complète (access + refresh token). 5 tentatives maximum
        ; au-delà, le ticket est définitivement invalidé.
      parameters:
      - description: Ticket et code reçu par email
        in: body
        name: verification
        required: true
        schema:
          $ref: '#/definitions/dto.VerifierCode2FARequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SessionResponseDTO'
        "400":
          description: corps de requête invalide
          schema:
            $ref: '#/definitions/dto.ErreurDTO'
        "401":
          description: ticket ou code invalide, expiré, ou tentatives épuisées
          schema:
            $ref: '#/definitions/dto.ErreurDTO'
        "500":
          description: erreur interne
          schema:
            $ref: '#/definitions/dto.ErreurDTO'
      summary: Connexion (étape 2/2) — vérification du code
      tags:
      - auth
  /auth/deconnexion:
    post:
      consumes:
      - application/json
      description: 'Révoque le refresh token fourni (déconnexion idempotente : ne
        renvoie pas d''erreur si déjà invalide)'
      parameters:
      - description: Refresh token à révoquer
        in: body
        name: deconnexion
        required: true
        schema:
          $ref: '#/definitions/dto.RafraichirRequestDTO'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: corps de requête invalide
          schema:
            $ref: '#/definitions/dto.ErreurDTO'
        "500":
          description: erreur interne
          schema:
            $ref: '#/definitions/dto.ErreurDTO'
      summary: Déconnexion
      tags:
      - auth
  /auth/mot-de-passe-oublie:
    post:
      consumes:
      - application/json
      description: Envoie un code par email si un compte existe pour cet email. Répond
        toujours le même succès générique, que le compte existe ou non (évite l'énumération
        de comptes).
      parameters:
      - description: Email du compte
        in: body
        name: demande
        required: true
        schema:
          $ref: '#/definitions/dto.DemanderReinitialisationRequestDTO'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: corps de requête invalide
          schema:
            $ref: '#/definitions/dto.ErreurDTO'
        "500":
          description: erreur interne
          schema:
            $ref: '#/definitions/dto.ErreurDTO'
      summary: Demande de réinitialisation de mot de passe
      tags:
      - auth
  /auth/rafraichir:
    post:
      consumes:
      - application/json
      description: Échange un refresh token valide contre une nouvelle paire access/refresh
        token (rotation)
      parameters:
      - description: Refresh token
        in: body
        name: rafraichir
        required: true
        schema:
          $ref: '#/definitions/dto.RafraichirRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SessionResponseDTO'
        "400":
          description: corps de requête invalide
          schema:
            $ref: '#/definitions/dto.ErreurDTO'
        "401":
          description: refresh token invalide, expiré ou révoqué
          schema:
            $ref: '#/definitions/dto.ErreurDTO'
        "500":
          description: erreur interne
          schema:
            $ref: '#/definitions/dto.ErreurDTO'
      summary: Rafraîchissement de session
      tags:
      - auth
  /auth/reinitialiser-mot-de-passe:
    post:
      consumes:
      - application/json
      description: Change le mot de passe si le code est valide et révoque toutes
        les sessions actives de l'utilisateur
      parameters:
      - description: Code reçu par email et nouveau mot de passe
        in: body
        name: reinitialisation
        required: true
        schema:
          $ref: '#/definitions/dto.ReinitialiserRequestDTO'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: corps de requête invalide
          schema:
            $ref: '#/definitions/dto.ErreurDTO'
        "401":
          description: code invalide, expiré ou déjà utilisé
          schema:
            $ref: '#/definitions/dto.ErreurDTO'
        "500":
          description: erreur interne
          schema:
            $ref: '#/definitions/dto.ErreurDTO'
      summary: Réinitialisation du mot de passe
      tags:
      - auth
  /backoffice/kyc/dossiers:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.DossierKycDTO'
            type: array
        "401":
          description: non authentifié
          schema:
            $ref: '#/definitions/dto.ErreurDTO'
        "403":
          description: réservé aux administrateurs
          schema:
            $ref: '#/definitions/dto.ErreurDTO'
        "500":
          description: erreur interne
          schema:
            $ref: '#/definitions/dto.ErreurDTO'
      security:
      - BearerAuth: []
      summary: Liste des dossiers KYC en attente
      tags:
      - backoffice-kyc
  /backoffice/kyc/dossiers/{id}/approuver:
    post:
      description: Fait passer l'utilisateur au Tier 2 et écrit une entrée d'audit
      parameters:
      - description: ID du dossier
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: non authentifié
          schema:
            $ref: '#/definitions/dto.ErreurDTO'
        "403":
          description: réservé aux administrateurs
          schema:
            $ref: '#/definitions/dto.ErreurDTO'
        "404":
          description: dossier introuvable
          schema:
            $ref: '#/definitions/dto.ErreurDTO'
        "422":
          description: dossier déjà traité
          schema:
            $ref: '#/definitions/dto.ErreurDTO'
        "500":
          description: erreur interne
          schema:
            $ref: '#/definitions/dto.ErreurDTO'
      security:
      - BearerAuth: []
      summary: Approuve un dossier KYC
      tags:
      - backoffice-kyc
  /backoffice/kyc/dossiers/{id}/rejeter:
    post:
      consumes:
      - application/json
      description: L'utilisateur reste au Tier 1 ; le motif lui est communiqué, il
        pourra resoumettre
      parameters:
      - description: ID du dossier
        in: path
        name: id
        required: true
        type: string
      - description: Motif du rejet
        in: body
        name: rejet
        required: true
        schema:
          $ref: '#/definitions/dto.RejeterDossierRequestDTO'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: corps de requête invalide
          schema:
            $ref: '#/definitions/dto.ErreurDTO'
        "401":
          description: non authentifié
          schema:
            $ref: '#/definitions/dto.ErreurDTO'
        "403":
          description: réservé aux administrateurs
          schema:
            $ref: '#/definitions/dto.ErreurDTO'
        "404":
          description: dossier introuvable
          schema:
            $ref: '#/definitions/dto.ErreurDTO'
        "422":
          description: dossier déjà traité
          schema:
            $ref: '#/definitions/dto.ErreurDTO'
        "500":
          description: erreur interne
          schema:
            $ref: '#/definitions/dto.ErreurDTO'
      security:
      - BearerAuth: []
      summary: Rejette un dossier KYC
      tags:
      - backoffice-kyc
  /kyc/demande-tier2:
    post:
      description: Crée un dossier KYC en attente de revue par un administrateur
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.DossierKycDTO'
        "401":
          description: non authentifié
          schema:
            $ref: '#/definitions/dto.ErreurDTO'
        "409":
          description: une demande est déjà en attente
          schema:
            $ref: '#/definitions/dto.ErreurDTO'
        "422":
          description: l'utilisateur n'est pas au Tier 1
          schema:
            $ref: '#/definitions/dto.ErreurDTO'
        "500":
          description: erreur interne
          schema:
            $ref: '#/definitions/dto.ErreurDTO'
      security:
      - BearerAuth: []
      summary: Demande de passage au Tier 2
      tags:
      - kyc
  /kyc/inscription:
    post:
      consumes:
      - application/json
      description: Crée un utilisateur et son wallet associé (KYC Tier 1 auto-validé
        selon les règles du pays)
      parameters:
      - description: Données d'inscription
        in: body
        name: inscription
        required: true
        schema:
          $ref: '#/definitions/dto.InscriptionRequestDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.InscriptionResponseDTO'
        "400":
          description: corps de requête invalide ou données de validation incorrectes
          schema:
            $ref: '#/definitions/dto.ErreurDTO'
        "409":
          description: email ou téléphone déjà utilisé
          schema:
            $ref: '#/definitions/dto.ErreurDTO'
        "422":
          description: pays non supporté ou données métier invalides
          schema:
            $ref: '#/definitions/dto.ErreurDTO'
        "500":
          description: erreur interne
          schema:
            $ref: '#/definitions/dto.ErreurDTO'
      summary: Inscription d'un nouvel utilisateur
      tags:
      - kyc
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
