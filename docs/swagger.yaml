        pourra resoumettre
      parameters:
      - description: ID du dossier
        in: path
        name: id
        required: true
        type: string
      - description: Motif du rejet
        in: body
        name: rejet
        required: true
        schema:
          $ref: '#/definitions/kyc.RejeterDossierRequestDTO'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: corps de requête invalide
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
        "401":
          description: non authentifié
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
        "403":
          description: réservé aux administrateurs
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
        "404":
          description: dossier introuvable
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
        "422":
          description: dossier déjà traité
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
        "500":
          description: erreur interne
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
      security:
      - BearerAuth: []
      summary: Rejette un dossier KYC
      tags:
      - backoffice-kyc
  /backoffice/kyc/utilisateurs/{id}/documents:
    get:
      description: Renvoie les documents téléversés et le texte que l'OCR local en
        a extrait, pour aider à traiter son dossier de passage de palier.
      parameters:
      - description: ID de l'utilisateur
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/kyc.DocumentKycDTO'
            type: array
        "401":
          description: non authentifié
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
        "403":
          description: réservé aux administrateurs
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
        "500":
          description: erreur interne
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
      security:
      - BearerAuth: []
      summary: Liste des documents d'identité d'un utilisateur
      tags:
      - backoffice-kyc
  /kyc/demande-tier2:
    post:
      description: Crée un dossier KYC en attente de revue par un administrateur
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/kyc.DossierKycDTO'
        "401":
          description: non authentifié
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
        "409":
          description: une demande est déjà en attente
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
        "422":
          description: l'utilisateur n'est pas au Tier 1
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
        "500":
          description: erreur interne
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
      security:
      - BearerAuth: []
      summary: Demande de passage au Tier 2
      tags:
      - kyc
  /kyc/documents:
    post:
      consumes:
      - multipart/form-data
      description: 'Stocke le document et en extrait le texte par OCR local (Tesseract)
        — une aide à la saisie pour l''administrateur qui traitera le dossier, jamais
        une décision automatique. Formats acceptés : JPEG, PNG.'
      parameters:
      - description: Photo du document (CNI, passeport...)
        in: formData
        name: document
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/kyc.DocumentKycDTO'
        "400":
          description: fichier manquant ou illisible
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
        "401":
          description: non authentifié
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
        "422":
          description: format de document non supporté
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
        "500":
          description: erreur interne
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
      security:
      - BearerAuth: []
      summary: Téléversement d'un document d'identité
      tags:
      - kyc
  /kyc/inscription:
    post:
      consumes:
      - application/json
      description: Crée un utilisateur et son wallet associé (KYC Tier 1 auto-validé
        selon les règles du pays)
      parameters:
      - description: Données d'inscription
        in: body
        name: inscription
        required: true
        schema:
          $ref: '#/definitions/kyc.InscriptionRequestDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/kyc.InscriptionResponseDTO'
        "400":
          description: corps de requête invalide ou données de validation incorrectes
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
        "409":
          description: email ou téléphone déjà utilisé
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
        "422":
          description: pays non supporté ou données métier invalides
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
        "500":
          description: erreur interne
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
      summary: Inscription d'un nouvel utilisateur
      tags:
      - kyc
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
