basePath: /api/v1
definitions:
  admin.AuditLogDTO:
    properties:
      action:
        example: carte_gelee_admin
        type: string
      admin_id:
        example: 3fa2c1e4-9b5d-4a2e-8c1a-0e2f6a7b8c9d
        type: string
      cible_id:
        example: 7b8c9d0e-1f2a-4b3c-9d4e-5f6a7b8c9d0e
        type: string
      cible_type:
        example: carte
        type: string
      created_at:
        example: "2026-08-05T18:30:00Z"
        type: string
      details_json:
        example: '{"motif":"document illisible"}'
        type: string
      id:
        example: 9c1a2b3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d
        type: string
    type: object
  admin.ChangerRoleRequestDTO:
    properties:
      role:
        enum:
        - utilisateur
        - admin
        - super_admin
        example: admin
        type: string
    required:
    - role
    type: object
  admin.CreerAdministrateurRequestDTO:
    properties:
      email:
        example: awa.kone@raycard.app
        type: string
      mot_de_passe:
        example: motdepasse123
        minLength: 8
        type: string
      nom:
        example: Koné
        type: string
      pays_code:
        example: CI
        type: string
      prenom:
        example: Awa
        type: string
      role:
        enum:
        - admin
        - super_admin
        example: admin
        type: string
      telephone:
        example: "+2250700000000"
        type: string
    required:
    - email
    - mot_de_passe
    - nom
    - pays_code
    - prenom
    - role
    - telephone
    type: object
  admin.UtilisateurDTO:
    properties:
      created_at:
        example: "2026-08-05T18:30:00Z"
        type: string
      email:
        example: awa.kone@example.com
        type: string
      id:
        example: 3fa2c1e4-9b5d-4a2e-8c1a-0e2f6a7b8c9d
        type: string
      kyc_statut:
        example: verifie
        type: string
      kyc_tier:
        example: 1
        type: integer
      nom:
        example: Koné
        type: string
      pays_code:
        example: CI
        type: string
      prenom:
        example: Awa
        type: string
      role:
        example: utilisateur
        type: string
      telephone:
        example: "+2250700000000"
        type: string
    type: object
  admin.UtilisateurDetailDTO:
    properties:
      cartes:
        items:
          $ref: '#/definitions/carte.CarteDTO'
        type: array
      utilisateur:
        $ref: '#/definitions/admin.UtilisateurDTO'
      wallet:
        $ref: '#/definitions/wallet.WalletDTO'
    type: object
  auth.AppareilResponseDTO:
    properties:
      created_at:
        type: string
      id:
        type: string
      nom_appareil:
        type: string
    type: object
  auth.ChallengeEmpreinteResponseDTO:
    properties:
      challenge:
        type: string
      challenge_id:
        type: string
      expire_dans_sec:
        type: integer
    type: object
  auth.ChangerMotDePasseRequestDTO:
    properties:
      mot_de_passe_actuel:
        example: ancienmotdepasse123
        type: string
      nouveau_mot_de_passe:
        example: nouveaumotdepasse456
        minLength: 8
        type: string
    required:
    - mot_de_passe_actuel
    - nouveau_mot_de_passe
    type: object
  auth.ConfirmerChangementEmailRequestDTO:
    properties:
      code:
        example: "042951"
        type: string
    required:
    - code
    type: object
  auth.ConnexionGoogleRequestDTO:
    properties:
      id_token:
        type: string
      pays_code:
        example: CI
        type: string
      telephone:
        example: "+2250700000000"
        type: string
    required:
    - id_token
    - pays_code
    - telephone
    type: object
  auth.ConnexionRequestDTO:
    properties:
      email:
        example: awa.kone@example.com
        type: string
      mot_de_passe:
        example: motdepasse123
        type: string
    required:
    - email
    - mot_de_passe
    type: object
  auth.ConnexionResponseDTO:
    properties:
      expire_dans_sec:
        type: integer
      ticket:
        type: string
    type: object
  auth.DemanderChallengeEmpreinteRequestDTO:
    properties:
      appareil_id:
        type: string
    required:
    - appareil_id
    type: object
  auth.DemanderChangementEmailRequestDTO:
    properties:
      nouvel_email:
        example: nouveau.email@example.com
        type: string
    required:
    - nouvel_email
    type: object
  auth.DemanderReinitialisationRequestDTO:
    properties:
      email:
        example: awa.kone@example.com
        type: string
    required:
    - email
    type: object
  auth.EnregistrerAppareilRequestDTO:
    properties:
      cle_publique:
        example: MCowBQYDK2VwAyEA...
        type: string
      nom_appareil:
        example: iPhone d'Awa
        maxLength: 100
        minLength: 1
        type: string
    required:
    - cle_publique
    - nom_appareil
    type: object
  auth.ModifierProfilRequestDTO:
    properties:
      nom:
        example: Koné
        maxLength: 100
        minLength: 2
        type: string
      prenom:
        example: Awa
        maxLength: 100
        minLength: 2
        type: string
    required:
    - nom
    - prenom
    type: object
  auth.RafraichirRequestDTO:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  auth.ReinitialiserRequestDTO:
    properties:
      nouveau_mot_de_passe:
        example: nouveaumotdepasse123
        minLength: 8
        type: string
      token:
        example: "042951"
        type: string
    required:
    - nouveau_mot_de_passe
    - token
    type: object
  auth.SessionResponseDTO:
    properties:
      access_token:
        type: string
      access_token_expire_at:
        type: string
      refresh_token:
        type: string
      refresh_token_expire_at:
        type: string
    type: object
  auth.UtilisateurDTO:
    properties:
      email:
        example: awa.kone@example.com
        type: string
      id:
        example: 3fa2c1e4-9b5d-4a2e-8c1a-0e2f6a7b8c9d
        type: string
      kyc_statut:
        example: verifie
        type: string
      kyc_tier:
        example: 1
        type: integer
      nom:
        example: Koné
        type: string
      pays_code:
        example: CI
        type: string
      photo_profil:
        type: string
      prenom:
        example: Awa
        type: string
      telephone:
        example: "+2250700000000"
        type: string
    type: object
  auth.VerifierCode2FARequestDTO:
    properties:
      code:
        example: "042951"
        type: string
      ticket:
        type: string
    required:
    - code
    - ticket
    type: object
  auth.VerifierEmpreinteRequestDTO:
    properties:
      challenge_id:
        type: string
      signature:
        type: string
    required:
    - challenge_id
    - signature
    type: object
  carte.CarteDTO:
    properties:
      devise:
        example: XOF
        type: string
      id:
        example: 3fa2c1e4-9b5d-4a2e-8c1a-0e2f6a7b8c9d
        type: string
      label:
        example: Carte courses
        type: string
      montant_charge_centimes:
        example: 10000
        type: integer
      solde_centimes:
        description: |-
          SoldeCentimes est le dernier solde connu, mis à jour périodiquement
          (pas en temps réel — voir carte.Carte.SoldeCentimes).
        example: 7500
        type: integer
      statut:
        example: active
        type: string
    type: object
  carte.CreerCarteRequestDTO:
    properties:
      label:
        example: Carte courses
        maxLength: 100
        minLength: 2
        type: string
      montant_centimes:
        example: 10000
        type: integer
    required:
    - label
    - montant_centimes
    type: object
  carte.DepenseCarteDTO:
    properties:
      detected_at:
        example: "2026-08-05T18:30:00Z"
        type: string
      id:
        example: 1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d
        type: string
      montant_centimes:
        example: 2500
        type: integer
    type: object
  carte.RechargerCarteRequestDTO:
    properties:
      montant_centimes:
        example: 5000
        type: integer
    required:
    - montant_centimes
    type: object
  commun.ErreurDTO:
    properties:
      erreur:
        example: un compte existe déjà avec cet email
        type: string
    type: object
  kyc.DocumentKycDTO:
    properties:
      created_at:
        type: string
      dossier_kyc_id:
        type: string
      id:
        type: string
      nom_fichier:
        type: string
      texte_extrait:
        type: string
      type_document:
        example: recto_piece_identite
        type: string
    type: object
  kyc.DossierKycDTO:
    properties:
      admin_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      motif_rejet:
        type: string
      statut:
        type: string
      tier_demande:
        type: integer
      traite_at:
        type: string
      utilisateur_id:
        type: string
    type: object
  kyc.InscriptionRequestDTO:
    properties:
      email:
        example: awa.kone@example.com
        type: string
      mot_de_passe:
        example: motdepasse123
        minLength: 8
        type: string
      nom:
        example: Koné
        maxLength: 100
        minLength: 2
        type: string
      pays_code:
        example: CI
        type: string
      prenom:
        example: Awa
        maxLength: 100
        minLength: 2
        type: string
      telephone:
        example: "+2250700000000"
        type: string
    required:
    - email
    - mot_de_passe
    - nom
    - pays_code
    - prenom
    - telephone
    type: object
  kyc.InscriptionResponseDTO:
    properties:
      utilisateur:
        $ref: '#/definitions/kyc.UtilisateurDTO'
      wallet:
        $ref: '#/definitions/kyc.WalletDTO'
    type: object
  kyc.RejeterDossierRequestDTO:
    properties:
      motif:
        example: pièce d'identité illisible
        minLength: 3
        type: string
    required:
    - motif
    type: object
  kyc.UtilisateurDTO:
    properties:
      email:
        example: awa.kone@example.com
        type: string
      id:
        example: 3fa2c1e4-9b5d-4a2e-8c1a-0e2f6a7b8c9d
        type: string
      kyc_statut:
        example: verifie
        type: string
      kyc_tier:
        example: 1
        type: integer
      nom:
        example: Koné
        type: string
      pays_code:
        example: CI
        type: string
      prenom:
        example: Awa
        type: string
      telephone:
        example: "+2250700000000"
        type: string
    type: object
  kyc.WalletDTO:
    properties:
      devise:
        example: XOF
        type: string
      id:
        example: 7b8c9d0e-1f2a-4b3c-9d4e-5f6a7b8c9d0e
        type: string
      solde_disponible_centimes:
        example: 0
        type: integer
      solde_en_attente_centimes:
        example: 0
        type: integer
      statut:
        example: actif
        type: string
    type: object
  wallet.InitierRechargeRequestDTO:
    properties:
      montant_centimes:
        example: 5000
        type: integer
      operateur:
        example: ORANGE
        type: string
      telephone:
        example: "+2250700000000"
        type: string
    required:
    - montant_centimes
    - operateur
    - telephone
    type: object
  wallet.InitierRetraitRequestDTO:
    properties:
      montant_centimes:
        example: 5000
        type: integer
      operateur:
        example: ORANGE
        type: string
      telephone:
        example: "+2250700000000"
        type: string
    required:
    - montant_centimes
    - operateur
    - telephone
    type: object
  wallet.TransactionDTO:
    properties:
      created_at:
        example: "2026-08-05T18:30:00Z"
        type: string
      devise:
        example: XOF
        type: string
      frais_centimes:
        example: 75
        type: integer
      id:
        example: 9c1a2b3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d
        type: string
      montant_centimes:
        example: 5000
        type: integer
      operateur:
        example: ORANGE
        type: string
      statut:
        example: envoyee
        type: string
      type:
        example: recharge
        type: string
    type: object
  wallet.WalletDTO:
    properties:
      devise:
        example: XOF
        type: string
      id:
        example: 7b8c9d0e-1f2a-4b3c-9d4e-5f6a7b8c9d0e
        type: string
      solde_disponible_centimes:
        example: 492500
        type: integer
      solde_en_attente_centimes:
        example: 0
        type: integer
      statut:
        example: actif
        type: string
    type: object
host: localhost:3000
info:
  contact:
    name: RAYCARD — HR-Skills SARL
  description: API backend de la plateforme RAYCARD (wallet Mobile Money + cartes
    Visa virtuelles).
  title: RAYCARD API
  version: "1.0"
paths:
  /auth/connexion:
    post:
      consumes:
      - application/json
      description: Vérifie email + mot de passe et déclenche la 2FA obligatoire pour
        tout compte, client comme admin (envoie un code par email, renvoie un ticket
        à présenter sur /auth/connexion/verifier-code — aucun token de session ici).
      parameters:
      - description: Identifiants
        in: body
        name: connexion
        required: true
        schema:
          $ref: '#/definitions/auth.ConnexionRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.ConnexionResponseDTO'
        "400":
          description: corps de requête invalide
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
        "401":
          description: identifiants invalides
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
        "500":
          description: erreur interne
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
      summary: Connexion (étape 1/2)
      tags:
      - '"1. Client - Auth"'
  /auth/connexion-google:
    post:
      consumes:
      - application/json
      description: 'Vérifie l''ID token Google (crée le compte automatiquement s''il
        n''existe pas encore, ou lie ce compte Google à un compte existant de même
        email si Google confirme l''email vérifié), puis déclenche la 2FA obligatoire
        comme pour /auth/connexion : envoie un code par email et renvoie un ticket
        à présenter sur /auth/connexion/verifier-code.'
      parameters:
      - description: ID token Google, téléphone et pays (utilisés seulement à la création)
        in: body
        name: connexion
        required: true
        schema:
          $ref: '#/definitions/auth.ConnexionGoogleRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.ConnexionResponseDTO'
        "400":
          description: corps de requête invalide, ou téléphone/pays manquants pour
            une première connexion
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
        "401":
          description: id token invalide, ou email non vérifié pour lier un compte
            existant
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
        "500":
          description: erreur interne
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
      summary: Connexion via Google (étape 1/2)
      tags:
      - '"1. Client - Auth"'
  /auth/connexion/verifier-code:
    post:
      consumes:
      - application/json
      description: Échange le ticket obtenu à l'étape 1 et le code reçu par email
        contre une session complète (access + refresh token). 5 tentatives maximum
        ; au-delà, le ticket est définitivement invalidé et une alerte de sécurité
        est envoyée. Une connexion réussie déclenche aussi une notification par email.
      parameters:
      - description: Ticket et code reçu par email
        in: body
        name: verification
        required: true
        schema:
          $ref: '#/definitions/auth.VerifierCode2FARequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.SessionResponseDTO'
        "400":
          description: corps de requête invalide
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
        "401":
          description: ticket ou code invalide, expiré, ou tentatives épuisées
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
        "500":
          description: erreur interne
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
      summary: Connexion (étape 2/2) — vérification du code
      tags:
      - '"1. Client - Auth"'
  /auth/deconnexion:
    post:
      consumes:
      - application/json
      description: 'Révoque le refresh token fourni (déconnexion idempotente : ne
        renvoie pas d''erreur si déjà invalide)'
      parameters:
      - description: Refresh token à révoquer
        in: body
        name: deconnexion
        required: true
        schema:
          $ref: '#/definitions/auth.RafraichirRequestDTO'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: corps de requête invalide
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
        "500":
          description: erreur interne
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
      summary: Déconnexion
      tags:
      - '"1. Client - Auth"'
  /auth/empreinte/appareils:
    post:
      consumes:
      - application/json
      description: Associe la clé publique générée par l'appareil (après déverrouillage
        biométrique) à l'utilisateur authentifié. L'empreinte elle-même et la clé
        privée ne quittent jamais l'appareil.
      parameters:
      - description: Clé publique de l'appareil
        in: body
        name: appareil
        required: true
        schema:
          $ref: '#/definitions/auth.EnregistrerAppareilRequestDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.AppareilResponseDTO'
        "400":
          description: corps de requête invalide ou clé publique mal formée
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
        "401":
          description: non authentifié
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
        "500":
          description: erreur interne
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
      security:
      - BearerAuth: []
      summary: Enregistrement d'un appareil pour la connexion par empreinte
      tags:
      - '"1. Client - Auth"'
  /auth/empreinte/appareils/{id}:
    delete:
      description: Invalide définitivement un appareil (perte, vol, ou l'utilisateur
        ne veut plus l'utiliser).
      parameters:
      - description: ID de l'appareil
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: non authentifié
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
        "404":
          description: appareil introuvable
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
        "500":
          description: erreur interne
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
      security:
      - BearerAuth: []
      summary: Révocation d'un appareil enregistré pour l'empreinte
      tags:
      - '"1. Client - Auth"'
  /auth/empreinte/challenge:
    post:
      consumes:
      - application/json
      description: Émet un nonce à signer avec la clé privée de l'appareil désigné
        (déverrouillée par empreinte côté client).
      parameters:
      - description: Appareil concerné
        in: body
        name: demande
        required: true
        schema:
          $ref: '#/definitions/auth.DemanderChallengeEmpreinteRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.ChallengeEmpreinteResponseDTO'
        "400":
          description: corps de requête invalide
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
        "401":
          description: appareil inconnu ou révoqué
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
        "429":
          description: trop de tentatives, réessayer plus tard
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
        "500":
          description: erreur interne
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
      summary: Demande d'un challenge pour la connexion par empreinte
      tags:
      - '"1. Client - Auth"'
  /auth/empreinte/verifier:
    post:
      consumes:
      - application/json
      description: 'Échange un challenge signé par la clé privée de l''appareil contre
        une session complète. Contrairement aux autres méthodes de connexion, aucun
        code par email n''est requis : l''appareil et l''empreinte qui l''a déverrouillé
        constituent déjà deux facteurs.'
      parameters:
      - description: Challenge signé
        in: body
        name: verification
        required: true
        schema:
          $ref: '#/definitions/auth.VerifierEmpreinteRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.SessionResponseDTO'
        "400":
          description: corps de requête invalide
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
        "401":
          description: challenge invalide, expiré, ou signature incorrecte
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
        "500":
          description: erreur interne
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
      summary: Connexion par empreinte digitale
      tags:
      - '"1. Client - Auth"'
  /auth/inscription:
    post:
      consumes:
      - application/json
      description: Crée un utilisateur et son wallet associé (KYC Tier 1 auto-validé
        selon les règles du pays)
      parameters:
      - description: Données d'inscription
        in: body
        name: inscription
        required: true
        schema:
          $ref: '#/definitions/kyc.InscriptionRequestDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/kyc.InscriptionResponseDTO'
        "400":
          description: corps de requête invalide ou données de validation incorrectes
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
        "409":
          description: email ou téléphone déjà utilisé
