        de carte...) du wallet de l'utilisateur authentifié, les plus récentes d'abord.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/wallet.TransactionDTO'
            type: array
        "401":
          description: non authentifié
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
        "404":
          description: wallet introuvable
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
        "500":
          description: erreur interne
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
      security:
      - BearerAuth: []
      summary: Historique des transactions du wallet
      tags:
      - '"1. Client - Wallet"'
  /webhooks/hrpay:
    post:
      consumes:
      - application/json
      description: Reçoit les notifications de confirmation de paiement de l'agrégateur.
        Vérifie la signature HMAC avant tout traitement.
      parameters:
      - description: Signature HMAC-SHA256 du corps brut
        in: header
        name: X-Hub-Signature
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "401":
          description: signature invalide
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
        "404":
          description: transaction introuvable
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
        "500":
          description: erreur interne
          schema:
            $ref: '#/definitions/commun.ErreurDTO'
      summary: Webhook HR-Skills Pay
      tags:
      - '"3. Système - Webhooks"'
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
